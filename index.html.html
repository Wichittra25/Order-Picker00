<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1C1F26">
<title>ระบบหยิบของ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#F3F4F6;--panel:#FFF;--ink:#1C1F26;--sub:#6B7280;--line:#E3E5E9;--side1:#2F6690;--side1-soft:#E7F0F6;--side2:#B5651D;--side2-soft:#F7EAE0;--ok:#1E8E4E;--ok-soft:#E4F4EA;--warn:#C4880B;--warn-soft:#FCF1DA;--idle:#8A8F98;--idle-soft:#EEEFF1;--danger:#C4362B}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{touch-action:manipulation}
button{cursor:pointer}
.mono{font-family:'JetBrains Mono',monospace}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:74px}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header .title{font-weight:800;font-size:17px;letter-spacing:.2px}
header .title .tag{font-family:'JetBrains Mono',monospace;font-weight:700;background:#3A3F4B;font-size:10px;padding:2px 6px;border-radius:4px;margin-left:8px;vertical-align:middle}
header .who{display:flex;align-items:center;gap:8px}
header .who .name{font-size:12px;color:#DADEE5}
header .logout{background:none;border:none;color:#DADEE5;font-size:11px;font-weight:700;text-decoration:underline;padding:0}
main{flex:1;padding:14px 14px 10px}
h2.page-title{font-size:15px;font-weight:800;margin:2px 0 12px;color:var(--ink);display:flex;align-items:center;gap:8px}
.badge-floor{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;padding:3px 8px;border-radius:5px;border:1.5px dashed currentColor}
.side1 .badge-floor{color:var(--side1)} .side2 .badge-floor{color:var(--side2)}
.card,.ov-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.empty{text-align:center;color:var(--sub);padding:40px 16px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.receipt-card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:12px;padding:14px;margin-bottom:12px}
.receipt-card.done{border-left-color:var(--ok)}
.receipt-head,.ov-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.receipt-line{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.receipt-line:first-of-type{border-top:none;padding-top:0}
.receipt-line-main{min-width:0}.receipt-line-main b{font-size:14.5px}
.receipt-line-qty{font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap;padding-top:2px}
.item-order{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;background:var(--idle-soft);color:var(--idle);padding:2px 7px;border-radius:5px}
.item-status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.item-status.idle,.item-status.partial{background:var(--warn-soft);color:var(--warn)}
.item-status.complete{background:var(--ok-soft);color:var(--ok)}
.item-attrs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.attr{font-size:11.5px;color:var(--sub);background:var(--bg);border:1px solid var(--line);padding:2px 8px;border-radius:20px}
.ov-order{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:14px}
.ov-pill{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px}
.ov-pill.ready{background:var(--ok-soft);color:var(--ok)} .ov-pill.pending{background:var(--warn-soft);color:var(--warn)} .ov-pill.none{background:var(--idle-soft);color:var(--idle)}
.barwrap{height:8px;background:var(--bg);border-radius:20px;overflow:hidden;margin:6px 0}
.bar{height:100%;background:var(--ok);border-radius:20px;transition:width .2s}
.ov-meta{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin:10px 0 5px}
input[type=text],input[type=number],input[type=date],select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--side1);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle-row{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap}
.toggle-row button{flex:1;min-width:70px;padding:10px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--sub)}
.toggle-row button.active.s1{background:var(--side1);border-color:var(--side1);color:#fff}
.toggle-row button.active.s2{background:var(--side2);border-color:var(--side2);color:#fff}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;margin-top:14px}
.btn.secondary{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.section-title{font-size:13px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin:22px 0 10px}
.admin-order-row,.admin-user-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.admin-order-row:last-child,.admin-user-row:last-child{border-bottom:none}
.del-x{background:none;border:none;color:var(--danger);font-size:18px;font-weight:800;padding:4px 8px;flex-shrink:0}
.datalist-hint{font-size:11px;color:var(--sub);margin-top:-2px;margin-bottom:2px}
.chip-select{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip-select button{padding:7px 12px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--sub);font-family:'JetBrains Mono',monospace}
.chip-select button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.role-pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase}
.role-pill.admin{background:#EAE1F6;color:#6B3FA0}.role-pill.floor{background:var(--idle-soft);color:var(--idle)}
.access-link-row{display:flex;gap:6px;margin-top:9px}.access-link-input{flex:1;padding:8px 10px;font-size:11px;border:1.5px dashed var(--line);border-radius:8px;background:var(--bg);color:var(--sub)}
.copy-link-btn{flex-shrink:0;padding:0 14px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;font-size:12px;font-weight:700}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;z-index:30}
nav.bottom button{flex:1;padding:10px 4px 12px;background:none;border:none;color:var(--sub);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bottom button .ico{font-size:19px}nav.bottom button.active{color:var(--ink)}
.floor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.floor-tile{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px;text-align:left;width:100%}
.floor-tile .code{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:15px}
.floor-tile .cat{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.4}.floor-tile.s1{border-left:5px solid var(--side1)}.floor-tile.s2{border-left:5px solid var(--side2)}
.floor-tile .count{margin-top:8px;font-size:11px;font-weight:700;color:var(--sub)}
.back-btn{background:none;border:none;color:var(--sub);font-size:13px;font-weight:600;padding:0 0 10px;display:flex;align-items:center;gap:4px}
#loginScreen{max-width:360px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#loginScreen .logo{font-size:34px;margin-bottom:6px}#loginScreen h1{font-size:19px;font-weight:800;margin:0 0 2px}#loginScreen p.sub{font-size:12.5px;color:var(--sub);margin:0 0 22px;text-align:center}
.pin-dots{display:flex;gap:12px;margin-bottom:22px}.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}.pin-dots span.filled{background:var(--ink);border-color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px}.keypad button{padding:16px 0;font-size:20px;font-weight:700;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-family:'JetBrains Mono',monospace}.keypad button.fn{font-family:'Inter',sans-serif;font-size:13px;color:var(--sub);font-weight:700}
.login-error{color:var(--danger);font-size:12.5px;font-weight:600;margin-top:14px;min-height:16px}.login-hint{margin-top:26px;font-size:11px;color:var(--sub);text-align:center;line-height:1.6}
#fatalError{display:none;max-width:520px;margin:0 auto;padding:30px 20px;text-align:center}.fatal-icon{font-size:40px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;z-index:100;max-width:calc(100% - 30px);display:none}
@media(max-width:380px){.row2{grid-template-columns:1fr}.floor-grid{grid-template-columns:1fr}header .title{font-size:15px}header .who .name{display:none}}
::placeholder{color:#B7BCC4}
</style>
</head>
<body>
<div id="fatalError"><div class="fatal-icon">⚠️</div><b>ระบบเปิดไม่ได้</b><p id="fatalMessage" style="color:var(--sub);font-size:13px"></p><button class="btn" onclick="location.reload()">ลองใหม่</button></div>

<div id="loginScreen" style="display:none">
  <div class="logo">📦</div><h1>ระบบหยิบของ</h1><p class="sub">ใส่รหัส PIN ของคุณเพื่อเข้าใช้งาน</p>
  <div class="pin-dots" id="pinDots"></div><div class="keypad" id="keypad"></div>
  <div class="login-error" id="loginError"></div>
  <div class="login-hint">รหัสเริ่มต้นของแอดมิน (ครั้งแรก): <b class="mono">0000</b><br>เข้าไปเปลี่ยน/เพิ่มผู้ใช้ได้ในแท็บแอดมิน</div>
</div>

<div id="app" style="display:none">
<header><div class="title">📦 ระบบหยิบของ<span class="tag">MOBILE</span></div><div class="who"><div class="name" id="whoName"></div><button class="logout" id="logoutBtn">ออกจากระบบ</button></div></header>
<main id="main"></main><nav class="bottom" id="bottomNav"></nav>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';

const FLOORS={
 F1S1:{side:1,floor:1,label:'ฝั่ง 1 ชั้น 1',cats:'ของใช้ในครัวทั่วไป, ทิชชู่'},
 F1S2:{side:1,floor:2,label:'ฝั่ง 1 ชั้น 2',cats:'แมส, ของใช้สัตว์เลี้ยง, เทียน'},
 F1S3:{side:1,floor:3,label:'ฝั่ง 1 ชั้น 3',cats:'เครื่องเขียนทุกอย่าง'},
 F1S4:{side:1,floor:4,label:'ฝั่ง 1 ชั้น 4',cats:'กิ๊ฟชอป'},
 F2S1:{side:2,floor:1,label:'ฝั่ง 2 ชั้น 1',cats:'ของใช้ทำสวน, มีด, ของฝั่ง1ชั้น1(ครัว/ทิชชู่)ขายปลีก'},
 F2S2:{side:2,floor:2,label:'ฝั่ง 2 ชั้น 2',cats:'เสื้อผ้า, เครื่องเขียนของฝั่ง1ชั้น3ขายปลีก'},
 F2S3:{side:2,floor:3,label:'ฝั่ง 2 ชั้น 3',cats:'ของจากฝั่ง1ชั้น4(กิ๊ฟชอป)ขายปลีก, ชุดไทย/เครื่องประดับหัวไทย'}
};

let orders=[],items=[],users=[],currentUser=null,route={page:'overview'},enteredPin='';
let db=null,docRef=null,dataReady=false,saveBusy=false;

const $=s=>document.querySelector(s);
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const firebaseConfig={
 apiKey:"AIzaSyCPWe9wqG2l2bHVY5SF2rWzOj7wH6I6SE",
 authDomain:"orderpicker-76833.firebaseapp.com",
 projectId:"orderpicker-76833",
 storageBucket:"orderpicker-76833.firebasestorage.app",
 messagingSenderId:"953241527860",
 appId:"1:953241527860:web:ae86addec630a9e44f0c61"
};
const DEFAULT_ADMIN={id:'admin-1',name:'แอดมิน',pin:'0000',role:'admin',floors:[]};

function showToast(msg){
 const el=$('#toast'); if(!el)return; el.textContent=msg; el.style.display='block';
 clearTimeout(showToast.t); showToast.t=setTimeout(()=>el.style.display='none',2200);
}
function showFatal(err){
 console.error(err);
 $('#loginScreen').style.display='none';$('#app').style.display='none';$('#fatalError').style.display='block';
 $('#fatalMessage').textContent=err?.message||String(err||'เกิดข้อผิดพลาด');
}
function normalizeData(data){
 return {
  orders:Array.isArray(data?.orders)?data.orders:[],
  items:Array.isArray(data?.items)?data.items:[],
  users:Array.isArray(data?.users)?data.users:[]
 };
}
function initFirebase(){
 if(!window.firebase) throw new Error('โหลด Firebase ไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ต');
 if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
 db=firebase.firestore();
 docRef=db.collection('warehouse').doc('shop1');
}
async function transactionUpdate(mutator){
 if(!docRef) throw new Error('Firebase ยังไม่พร้อม');
 return db.runTransaction(async tx=>{
  const snap=await tx.get(docRef);
  const data=normalizeData(snap.exists?snap.data():{});
  if(data.users.length===0) data.users=[{...DEFAULT_ADMIN}];
  const result=mutator(data) || data;
  tx.set(docRef,{orders:result.orders,items:result.items,users:result.users},{merge:true});
  return result;
 });
}
async function ensureInitialData(){
 const snap=await docRef.get();
 if(!snap.exists){
  await docRef.set({orders:[],items:[],users:[{...DEFAULT_ADMIN}]});
 }else{
  const d=normalizeData(snap.data());
  if(!d.users.length) await docRef.set({users:[{...DEFAULT_ADMIN}]},{merge:true});
 }
}
function listenForChanges(onFirstLoad){
 docRef.onSnapshot(snap=>{
  const d=normalizeData(snap.exists?snap.data():{});
  orders=d.orders;items=d.items;users=d.users.length?d.users:[{...DEFAULT_ADMIN}];
  if(!dataReady){dataReady=true;onFirstLoad();return}
  if(currentUser){
   const fresh=users.find(u=>u.id===currentUser.id);
   if(!fresh){showLogin();showToast('บัญชีนี้ถูกลบออกแล้ว');return}
   currentUser=fresh;render();
  }
 },err=>showFatal(new Error('เชื่อมต่อฐานข้อมูลไม่ได้: '+err.message)));
}
function nextItemId(){
 const nums=items.map(i=>parseInt(String(i.id||'').split('-')[1],10)).filter(Number.isFinite);
 return 'IT-'+String((nums.length?Math.max(...nums):0)+1).padStart(6,'0');
}
function allowedFloorCodes(){
 if(!currentUser)return [];
 return currentUser.role==='admin'?Object.keys(FLOORS):(currentUser.floors||[]).filter(c=>FLOORS[c]);
}
function receiptsForFloor(code){
 const f=FLOORS[code]; if(!f)return [];
 const floorItems=items.filter(i=>Number(i.side)===f.side&&Number(i.floor)===f.floor);
 return [...new Set(floorItems.map(i=>i.orderId))].map(oid=>{
  const its=floorItems.filter(i=>i.orderId===oid);
  return {orderId:oid,items:its,isDone:its.length>0&&its.every(i=>Number(i.qtyPicked||0)>=Number(i.qtyOrdered||0))};
 });
}
function receiptsForOrder(oid){
 const its=items.filter(i=>i.orderId===oid),groups={};
 its.forEach(i=>{const k=i.side+'-'+i.floor;(groups[k]??={side:i.side,floor:i.floor,items:[]}).items.push(i)});
 return Object.values(groups).map(g=>({side:g.side,floor:g.floor,code:'F'+g.side+'S'+g.floor,items:g.items,isDone:g.items.length>0&&g.items.every(i=>Number(i.qtyPicked||0)>=Number(i.qtyOrdered||0))}));
}

/* LOGIN */
function renderKeypad(){
 const keys=['1','2','3','4','5','6','7','8','9','clear','0','back'];
 $('#keypad').innerHTML=keys.map(k=>k==='clear'?'<button class="fn" data-k="clear">ล้าง</button>':k==='back'?'<button class="fn" data-k="back">⌫</button>':`<button data-k="${k}">${k}</button>`).join('');
 document.querySelectorAll('#keypad button').forEach(b=>b.onclick=()=>onKey(b.dataset.k));
}
function updateDots(){$('#pinDots').innerHTML=Array.from({length:6},(_,i)=>`<span class="${i<enteredPin.length?'filled':''}"></span>`).join('')}
function onKey(k){
 $('#loginError').textContent='';
 if(k==='clear')enteredPin='';else if(k==='back')enteredPin=enteredPin.slice(0,-1);else if(enteredPin.length<6)enteredPin+=k;
 updateDots();
 if(enteredPin.length>=4){
  const match=users.find(u=>String(u.pin)===enteredPin);
  if(match){currentUser=match;enteredPin='';showApp()}
  else if(enteredPin.length===6){$('#loginError').textContent='ไม่พบรหัส PIN นี้ ลองใหม่อีกครั้ง';enteredPin='';updateDots()}
 }
}
function showLogin(){
 currentUser=null;enteredPin='';$('#loginScreen').style.display='flex';$('#app').style.display='none';$('#fatalError').style.display='none';updateDots();renderKeypad();
}
function showApp(){
 if(!currentUser)return showLogin();
 $('#loginScreen').style.display='none';$('#app').style.display='flex';
 $('#whoName').innerHTML=esc(currentUser.name)+` <span class="role-pill ${currentUser.role}">${currentUser.role==='admin'?'แอดมิน':'พนักงานชั้น'}</span>`;
 const allowed=allowedFloorCodes();
 route=currentUser.role==='admin'?{page:'overview'}:(allowed.length===1?{page:'floor',code:allowed[0]}:{page:'floors'});
 renderNav();render();
}
function tryAutoLoginOrShowLogin(){
 const pin=new URLSearchParams(location.search).get('pin');
 if(pin){
  const match=users.find(u=>String(u.pin)===pin);
  if(match){currentUser=match;showApp();return}
 }
 showLogin();
}
function accessLinkFor(pin){return location.origin+location.pathname+'?pin='+encodeURIComponent(pin)}
$('#logoutBtn').onclick=()=>{history.replaceState({},'',location.pathname);showLogin()};

/* NAV / ROUTING */
function renderNav(){
 const isAdmin=currentUser?.role==='admin';
 let html='<button data-nav="overview"><span class="ico">📊</span>ภาพรวม</button><button data-nav="floors"><span class="ico">🗂️</span>หยิบของ</button>';
 if(isAdmin)html+='<button data-nav="admin"><span class="ico">🛠️</span>แอดมิน</button>';
 $('#bottomNav').innerHTML=html;
 document.querySelectorAll('nav.bottom button').forEach(b=>b.onclick=()=>{route={page:b.dataset.nav};render()});
 setNav(route.page==='floor'?'floors':route.page);
}
function setNav(active){document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.nav===active))}
function render(){
 try{
  if(!currentUser)return;
  if(route.page==='overview')renderOverview();else if(route.page==='floors')renderFloorPicker();else if(route.page==='floor')renderFloor(route.code);else if(route.page==='admin'&&currentUser.role==='admin')renderAdmin();else{route={page:'overview'};renderOverview()}
  setNav(route.page==='floor'?'floors':route.page);
 }catch(e){showFatal(e)}
}

/* OVERVIEW */
function renderOverview(){
 const orderIds=[...new Set(items.map(i=>i.orderId))];
 let html='<h2 class="page-title">ภาพรวมออเดอร์</h2>';
 if(!orderIds.length)html+='<div class="empty"><b>ยังไม่มีรายการ</b>รอแอดมินเพิ่มออเดอร์และรายการสินค้า</div>';
 orderIds.forEach(oid=>{
  const receipts=receiptsForOrder(oid),total=receipts.length,done=receipts.filter(r=>r.isDone).length,pct=total?Math.round(done/total*100):0,meta=orders.find(o=>o.orderId===oid);
  let pc='none',pt='ยังไม่เริ่ม';if(done===total&&total){pc='ready';pt='✅ พร้อมตรวจ'}else if(done){pc='pending';pt='⏳ ยังไม่ครบ'}
  const chips=receipts.map(r=>`<span class="attr" style="${r.isDone?'color:var(--ok);border-color:#BFE3CC':''}">${r.isDone?'✓ ':''}${r.code}</span>`).join('');
  html+=`<div class="ov-card"><div class="ov-top"><div class="ov-order">${esc(oid)}</div><div class="ov-pill ${pc}">${pt}</div></div><div class="barwrap"><div class="bar" style="width:${pct}%"></div></div><div class="ov-meta"><span>ใบเสร็จเสร็จแล้ว ${done}/${total} ชั้น</span><span>${meta?.date?esc(meta.date):''}</span></div><div class="item-attrs" style="margin-top:8px">${chips}</div></div>`;
 });
 $('#main').innerHTML=html;
}

/* FLOORS */
function renderFloorPicker(){
 const allowed=allowedFloorCodes();let html='<h2 class="page-title">เลือกฝั่ง / ชั้น</h2><div class="floor-grid">';
 allowed.forEach(code=>{const f=FLOORS[code],rs=receiptsForFloor(code),done=rs.filter(r=>r.isDone).length;html+=`<button class="floor-tile s${f.side}" data-code="${code}"><div class="code">${code}</div><div class="cat">${esc(f.cats)}</div><div class="count">${rs.length?done+'/'+rs.length+' ใบเสร็จเสร็จแล้ว':'ยังไม่มีใบเสร็จ'}</div></button>`});
 html+='</div>';if(!allowed.length)html+='<div class="empty"><b>ยังไม่ได้รับมอบหมายชั้น</b>ให้แอดมินกำหนดชั้นให้บัญชีนี้ก่อน</div>';
 $('#main').innerHTML=html;document.querySelectorAll('.floor-tile').forEach(t=>t.onclick=()=>{route={page:'floor',code:t.dataset.code};render()});
}
function receiptCardHtml(r){
 const lines=r.items.map(i=>{
  const attrs=[];if(i.color&&i.color!=='-')attrs.push('สี '+i.color);if(i.size&&i.size!=='-')attrs.push('ไซส์ '+i.size);if(i.pattern&&i.pattern!=='-')attrs.push('ลาย '+i.pattern);if(i.model&&i.model!=='-')attrs.push('รุ่น '+i.model);
  const picked=Number(i.qtyPicked||0),ordered=Number(i.qtyOrdered||0);
  return `<div class="receipt-line"><div class="receipt-line-main"><b>${esc(i.category)}</b><div class="item-attrs">${attrs.map(a=>`<span class="attr">${esc(a)}</span>`).join('')||'<span class="attr">ไม่มีสเปกเพิ่มเติม</span>'}</div><div style="font-size:11.5px;color:var(--sub)">หยิบแล้ว ${picked}/${ordered}</div></div><div class="receipt-line-qty mono">${ordered} ชิ้น</div></div>`;
 }).join('');
 const meta=orders.find(o=>o.orderId===r.orderId);
 return `<div class="receipt-card ${r.isDone?'done':''}"><div class="receipt-head"><div><span class="item-order">${esc(r.orderId)}</span>${meta?.note?`<div style="font-size:11.5px;color:var(--sub);margin-top:4px">${esc(meta.note)}</div>`:''}</div><span class="item-status ${r.isDone?'complete':'idle'}">${r.isDone?'✓ เสร็จแล้ว':'รอหยิบ'}</span></div>${lines}${r.isDone?`<button class="btn secondary" style="margin-top:12px" data-undobtn="${esc(r.orderId)}">↺ ยกเลิก / หยิบใหม่</button>`:`<button class="btn" style="margin-top:12px" data-donebtn="${esc(r.orderId)}">✅ หยิบเสร็จแล้ว</button>`}</div>`;
}
function renderFloor(code){
 if(!FLOORS[code]||!allowedFloorCodes().includes(code)){route={page:'floors'};renderFloorPicker();return}
 const f=FLOORS[code],rs=receiptsForFloor(code),pending=rs.filter(r=>!r.isDone),done=rs.filter(r=>r.isDone),back=currentUser.role==='admin'||allowedFloorCodes().length>1;
 let html=back?'<button class="back-btn" id="backBtn">← กลับไปเลือกชั้น</button>':'';
 html+=`<h2 class="page-title side${f.side}"><span class="badge-floor">${code}</span>${esc(f.label)}</h2>`;
 if(!rs.length)html+=`<div class="empty"><b>ยังไม่มีใบเสร็จของชั้นนี้</b>แอดมินยังไม่ได้เพิ่มรายการเข้าฝั่ง ${f.side} ชั้น ${f.floor}</div>`;
 else{if(pending.length){html+=`<div class="section-title">รอหยิบ (${pending.length})</div>`;pending.forEach(r=>html+=receiptCardHtml(r))}if(done.length){html+=`<div class="section-title">หยิบเสร็จแล้ว (${done.length})</div>`;done.forEach(r=>html+=receiptCardHtml(r))}}
 $('#main').innerHTML=html;if(back)$('#backBtn').onclick=()=>{route={page:'floors'};render()};
 document.querySelectorAll('[data-donebtn]').forEach(b=>b.onclick=async()=>{await setReceiptDone(b.dataset.donebtn,f.side,f.floor,true,code)});
 document.querySelectorAll('[data-undobtn]').forEach(b=>b.onclick=async()=>{if(confirm('ยกเลิกการหยิบของใบเสร็จนี้ กลับไปเป็น "รอหยิบ"?'))await setReceiptDone(b.dataset.undobtn,f.side,f.floor,false,code)});
}
async function setReceiptDone(oid,side,floor,done,code){
 try{
  const b=document.querySelector(`[data-${done?'done':'undo'}btn="${CSS.escape(oid)}"]`);
  if(b)b.disabled=true;
  const result=await transactionUpdate(d=>{d.items=d.items.map(i=>i.orderId===oid&&Number(i.side)===side&&Number(i.floor)===floor?{...i,qtyPicked:done?Number(i.qtyOrdered||0):0}:i);return d});
  orders=result.orders;items=result.items;users=result.users;renderFloor(code);showToast(done?'บันทึกว่าหยิบเสร็จแล้ว':'ยกเลิกสถานะหยิบ');
 }catch(e){alert('บันทึกไม่สำเร็จ: '+e.message);renderFloor(code)}
}

/* ADMIN */
let adminSide=1,adminFloor=1,newUserFloors=[],newUserRole='floor';
function renderAdmin(){
 const orderOptions=orders.map(o=>`<option value="${esc(o.orderId)}">${esc(o.orderId)}</option>`).join('');
 const cats=[...new Set(Object.values(FLOORS).flatMap(f=>f.cats.split(',').map(c=>c.trim())))];
 $('#main').innerHTML=`<h2 class="page-title">แอดมิน</h2>
 <div class="section-title">1 · เพิ่ม / เลือกออเดอร์</div><div class="card">
 <label>รหัสออเดอร์</label><input type="text" id="ordId" placeholder="เช่น OD-0003">
 <div class="row2"><div><label>วันที่</label><input type="date" id="ordDate"></div><div><label>ลูกค้า / หมายเหตุ</label><input type="text" id="ordNote" placeholder="ไม่บังคับ"></div></div>
 <button class="btn secondary" id="addOrderBtn">+ บันทึกออเดอร์ใหม่</button>
 ${orders.length?'<div style="margin-top:14px">'+orders.map(o=>`<div class="admin-order-row"><span class="mono" style="font-weight:700">${esc(o.orderId)}</span><span style="font-size:12px;color:var(--sub);flex:1;margin-left:8px">${esc(o.note||'')}</span><button class="del-x" data-delorder="${esc(o.orderId)}">✕</button></div>`).join('')+'</div>':''}</div>
 <div class="section-title">2 · เพิ่มรายการสินค้า</div><div class="card">
 <label>ออเดอร์ที่จะเพิ่มรายการนี้ให้</label><select id="itemOrder">${orderOptions||'<option value="">— ยังไม่มีออเดอร์ —</option>'}</select>
 <label>ฝั่ง</label><div class="toggle-row"><button type="button" class="side-btn ${adminSide===1?'active s1':''}" data-side="1">ฝั่ง 1 (4 ชั้น)</button><button type="button" class="side-btn ${adminSide===2?'active s2':''}" data-side="2">ฝั่ง 2 (3 ชั้น)</button></div>
 <label>ชั้น</label><div class="toggle-row" id="floorRow"></div><div class="datalist-hint">หมวดของชั้นนี้: <span id="floorCatsHint"></span></div>
 <label>หมวดหมู่</label><input type="text" id="itemCat" list="catList" placeholder="เช่น เครื่องเขียน"><datalist id="catList">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <div class="row2"><div><label>สี</label><input type="text" id="itemColor" placeholder="-"></div><div><label>ไซส์</label><input type="text" id="itemSize" placeholder="-"></div></div>
 <div class="row2"><div><label>ลาย</label><input type="text" id="itemPattern" placeholder="-"></div><div><label>รุ่น</label><input type="text" id="itemModel" placeholder="-"></div></div>
 <label>จำนวนสั่ง</label><input type="number" id="itemQty" min="1" step="1" value="1"><button class="btn" id="addItemBtn">+ เพิ่มรายการ</button></div>
 <div class="section-title">3 · ผู้ใช้งาน / สิทธิ์ (${users.length})</div><div class="card">
 <label>ชื่อพนักงาน</label><input type="text" id="userName" placeholder="เช่น พี่แอน">
 <label>PIN (4-6 หลัก)</label><input type="text" id="userPin" inputmode="numeric" pattern="[0-9]*" placeholder="เช่น 1234" maxlength="6">
 <label>สิทธิ์</label><div class="toggle-row"><button type="button" class="role-btn ${newUserRole==='admin'?'active s1':''}" data-role="admin">แอดมิน (ทุกสิทธิ์)</button><button type="button" class="role-btn ${newUserRole==='floor'?'active s1':''}" data-role="floor">พนักงานชั้น</button></div>
 <div id="floorAssignWrap" style="${newUserRole==='floor'?'':'display:none'}"><label>มอบหมายชั้น (แตะเลือกได้หลายชั้น)</label><div class="chip-select" id="floorChips">${Object.keys(FLOORS).map(code=>`<button type="button" class="chip ${newUserFloors.includes(code)?'on':''}" data-code="${code}">${code}</button>`).join('')}</div></div>
 <button class="btn secondary" id="addUserBtn">+ เพิ่มผู้ใช้งาน</button>
 <div class="datalist-hint" style="margin-top:14px">แต่ละคนมีลิงก์เข้าใช้งานของตัวเอง (ลิงก์มี PIN) — ถ้าใช้ลิงก์นี้ควรเก็บไว้เฉพาะในเครื่องของพนักงาน</div>
 <div style="margin-top:6px">${users.map(u=>`<div class="admin-user-row" style="display:block"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><b class="mono">${esc(u.pin)}</b> — ${esc(u.name)} <span class="role-pill ${u.role}">${u.role==='admin'?'แอดมิน':'พนักงานชั้น'}</span>${u.role==='floor'?`<div style="font-size:11px;color:var(--sub);margin-top:2px">${(u.floors||[]).join(', ')||'ยังไม่มอบหมายชั้น'}</div>`:''}</div>${users.length>1?`<button class="del-x" data-deluser="${esc(u.id)}">✕</button>`:''}</div><div class="access-link-row"><input type="text" class="access-link-input mono" readonly value="${esc(accessLinkFor(u.pin))}"><button class="copy-link-btn" data-copy="${esc(accessLinkFor(u.pin))}">คัดลอก</button></div></div>`).join('')}</div></div>`;
 bindAdmin();
}
function bindAdmin(){
 const floorCount=adminSide===1?4:3;
 $('#floorRow').innerHTML=Array.from({length:floorCount},(_,idx)=>{const n=idx+1,code='F'+adminSide+'S'+n;return `<button type="button" class="floor-btn ${adminFloor===n?(adminSide===1?'active s1':'active s2'):''}" data-floor="${n}">ชั้น ${n}</button>`}).join('');
 updateFloorHint();
 document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{adminSide=Number(b.dataset.side);adminFloor=1;renderAdmin()});
 document.querySelectorAll('[data-floor]').forEach(b=>b.onclick=()=>{adminFloor=Number(b.dataset.floor);renderAdmin()});
 document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{newUserRole=b.dataset.role;renderAdmin()});
 document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const c=b.dataset.code;newUserFloors=newUserFloors.includes(c)?newUserFloors.filter(x=>x!==c):[...newUserFloors,c];b.classList.toggle('on',newUserFloors.includes(c))});
 $('#addOrderBtn').onclick=addOrder;
 $('#addItemBtn').onclick=addItem;
 $('#addUserBtn').onclick=addUser;
 document.querySelectorAll('[data-delorder]').forEach(b=>b.onclick=()=>deleteOrder(b.dataset.delorder));
 document.querySelectorAll('[data-deluser]').forEach(b=>b.onclick=()=>deleteUser(b.dataset.deluser));
 document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy));
}
function updateFloorHint(){
 const code='F'+adminSide+'S'+adminFloor,f=FLOORS[code];
 if($('#floorCatsHint'))$('#floorCatsHint').textContent=f.cats;
}
async function addOrder(){
 const orderId=$('#ordId').value.trim(),date=$('#ordDate').value,note=$('#ordNote').value.trim();
 if(!orderId)return alert('กรุณาใส่รหัสออเดอร์');if(orders.some(o=>o.orderId===orderId))return alert('รหัสออเดอร์นี้มีอยู่แล้ว');
 try{
  const d=await transactionUpdate(d=>{if(d.orders.some(o=>o.orderId===orderId))throw new Error('รหัสออเดอร์นี้มีอยู่แล้ว');d.orders.push({orderId,date:date||'',note});return d});
  orders=d.orders;items=d.items;users=d.users;renderAdmin();showToast('บันทึกออเดอร์แล้ว');
 }catch(e){alert('บันทึกไม่สำเร็จ: '+e.message)}
}
async function deleteOrder(oid){
 if(!confirm('ลบออเดอร์ '+oid+' และรายการสินค้าทั้งหมดของออเดอร์นี้ใช่หรือไม่?'))return;
 try{
  const d=await transactionUpdate(d=>{d.orders=d.orders.filter(o=>o.orderId!==oid);d.items=d.items.filter(i=>i.orderId!==oid);return d});
  orders=d.orders;items=d.items;users=d.users;renderAdmin();showToast('ลบออเดอร์แล้ว');
 }catch(e){alert('ลบไม่สำเร็จ: '+e.message)}
}
async function addItem(){
 const orderId=$('#itemOrder').value,category=$('#itemCat').value.trim(),qty=Math.floor(Number($('#itemQty').value));
 if(!orderId)return alert('กรุณาเลือกออเดอร์');if(!category)return alert('กรุณาใส่หมวดหมู่');if(!Number.isFinite(qty)||qty<1)return alert('จำนวนต้องมากกว่า 0');
 const item={id:nextItemId(),orderId,side:adminSide,floor:adminFloor,category,color:$('#itemColor').value.trim()||'-',size:$('#itemSize').value.trim()||'-',pattern:$('#itemPattern').value.trim()||'-',model:$('#itemModel').value.trim()||'-',qtyOrdered:qty,qtyPicked:0};
 try{
  const d=await transactionUpdate(d=>{const nums=d.items.map(i=>parseInt(String(i.id||'').split('-')[1],10)).filter(Number.isFinite);item.id='IT-'+String((nums.length?Math.max(...nums):0)+1).padStart(6,'0');d.items.push(item);return d});
  orders=d.orders;items=d.items;users=d.users;renderAdmin();showToast('เพิ่มรายการแล้ว');
 }catch(e){alert('บันทึกไม่สำเร็จ: '+e.message)}
}
async function addUser(){
 const name=$('#userName').value.trim(),pin=$('#userPin').value.trim();
 if(!name)return alert('กรุณาใส่ชื่อพนักงาน');if(!/^\d{4,6}$/.test(pin))return alert('PIN ต้องเป็นตัวเลข 4-6 หลัก');
 if(newUserRole==='floor'&&!newUserFloors.length)return alert('กรุณาเลือกอย่างน้อย 1 ชั้น');
 try{
  const user={id:'u-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name,pin,role:newUserRole,floors:newUserRole==='floor'?[...newUserFloors]:[]};
  const d=await transactionUpdate(d=>{if(d.users.some(u=>String(u.pin)===pin))throw new Error('PIN นี้ถูกใช้แล้ว');d.users.push(user);return d});
  orders=d.orders;items=d.items;users=d.users;newUserFloors=[];newUserRole='floor';renderAdmin();showToast('เพิ่มผู้ใช้งานแล้ว');
 }catch(e){alert('เพิ่มผู้ใช้ไม่สำเร็จ: '+e.message)}
}
async function deleteUser(id){
 const target=users.find(u=>u.id===id);if(!target)return;
 if(target.id==='admin-1')return alert('ไม่สามารถลบแอดมินเริ่มต้นได้');
 if(!confirm('ลบผู้ใช้งาน '+target.name+' ใช่หรือไม่?'))return;
 try{
  const d=await transactionUpdate(d=>{d.users=d.users.filter(u=>u.id!==id);return d});
  orders=d.orders;items=d.items;users=d.users;renderAdmin();showToast('ลบผู้ใช้งานแล้ว');
 }catch(e){alert('ลบไม่สำเร็จ: '+e.message)}
}
async function copyText(text){
 try{await navigator.clipboard.writeText(text);showToast('คัดลอกลิงก์แล้ว')}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('คัดลอกลิงก์แล้ว')}
}

/* STARTUP */
window.addEventListener('error',e=>{console.error(e.error||e.message)});
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);showFatal(e.reason||new Error('เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ'))});

(async function start(){
 try{
  initFirebase();
  await ensureInitialData();
  listenForChanges(tryAutoLoginOrShowLogin);
 }catch(e){showFatal(e)}
})();
</script>
</body>
